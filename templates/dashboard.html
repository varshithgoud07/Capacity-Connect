<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Capacity Connect</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand fw-bold" href="/">
            🎓 Capacity Connect
        </a>

        <div>

            <span class="text-white me-3">
                Welcome, {{ name }}
            </span>

            <a href="/logout" class="btn btn-danger">
                Logout
            </a>

        </div>

    </div>

</nav>

<div class="container mt-5">

    <h2 class="mb-4">Dashboard</h2>

    <div class="row g-4">

        <div class="col-md-4">
            <a href="/profile" class="text-decoration-none text-dark">
                <div class="card shadow h-100">
                    <div class="card-body text-center">
                        <h3>👤</h3>
                        <h5>Profile</h5>
                        <p>Manage your personal details.</p>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <div class="card shadow h-100">
                <div class="card-body text-center">
                    <h3>📄</h3>
                    <h5>Resume</h5>
                    <p>Coming Soon</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow h-100">
                <div class="card-body text-center">
                    <h3>💼</h3>
                    <h5>Internships</h5>
                    <p>Coming Soon</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow h-100">
                <div class="card-body text-center">
                    <h3>🤖</h3>
                    <h5>AI Mentor</h5>
                    <p>Coming Soon</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow h-100">
                <div class="card-body text-center">
                    <h3>🎤</h3>
                    <h5>Mock Interview</h5>
                    <p>Coming Soon</p>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow h-100">
                <div class="card-body text-center">
                    <h3>📈</h3>
                    <h5>Progress</h5>
                    <p>Coming Soon</p>
                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
