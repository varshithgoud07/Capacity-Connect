<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>My Profile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">👤 My Profile</h2>

        <p><b>Name:</b> {{ name }}</p>

        <p><b>Email:</b> {{ email }}</p>

        <p><b>Phone:</b> {{ phone if phone else "Not Added" }}</p>

        <p><b>Branch:</b> {{ branch if branch else "Not Added" }}</p>

        <p><b>Year:</b> {{ year if year else "Not Added" }}</p>

        <p><b>Skills:</b> {{ skills if skills else "Not Added" }}</p>

        <a href="/dashboard" class="btn btn-primary mb-3">
            Back to Dashboard
        </a>

        <hr>

        <h4>Edit Profile</h4>

        <form method="POST" action="/update_profile">

            <input
                class="form-control mb-3"
                type="text"
                name="phone"
                placeholder="Phone Number"
                value="{{ phone or '' }}">

            <input
                class="form-control mb-3"
                type="text"
                name="branch"
                placeholder="Branch"
                value="{{ branch or '' }}">

            <input
                class="form-control mb-3"
                type="text"
                name="year"
                placeholder="Year"
                value="{{ year or '' }}">

            <input
                class="form-control mb-3"
                type="text"
                name="skills"
                placeholder="Skills"
                value="{{ skills or '' }}">

            <button type="submit" class="btn btn-success">
                Save Profile
            </button>

        </form>

    </div>

</div>

</body>

</html>
